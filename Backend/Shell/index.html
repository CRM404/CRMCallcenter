<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM</title>

    <!-- Значок вкладки — из НАШЕГО набора (ui/icons.js, ключ home), инлайном:
         внешних адресов у приложения не осталось ни одного, и заводить ради
         значка отдельный файл незачем. До этого вкладка была пустым листом,
         хотя у CRM свои 52 значка (К20). Заголовок вкладки меняется вместе с
         открытыми разделами — shell/app.js, updateTitle(). -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%230000ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>'>

    <!-- Значков из сети больше нет. Набор проекта — инлайновый SVG, ui/icons.js:
         спрайт кладётся в документ при старте, размеры задаёт ui/icons.css.
         Font Awesome с cdnjs был единственной внешней таблицей стилей проекта —
         без сети интерфейс оставался без значков вовсе (С1). -->

    <!-- Порядок подключения = порядок блоков CSS, заданный дизайн-сессией:
         1 токены → 2 базовые элементы → 3 составные → 4 оболочка → 5 раскладка
         разделов. Раскладка разделов появится вместе с первым перенесённым
         разделом (этап 2) — своим файлом рядом с ним. -->

    <!-- 1. Токены -->
    <link rel="stylesheet" href="/ui/tokens.css">

    <!-- 2. Базовые элементы -->
    <link rel="stylesheet" href="/ui/icons.css">
    <link rel="stylesheet" href="/ui/button.css">
    <link rel="stylesheet" href="/ui/field.css">
    <link rel="stylesheet" href="/ui/chip.css">
    <link rel="stylesheet" href="/ui/tabs.css">
    <link rel="stylesheet" href="/ui/note.css">

    <!-- ui/solo.css здесь НЕ подключается: это раскладка страницы БЕЗ
         оболочки (вход оператора, выдача настройки туннеля). Оболочке она не
         нужна ни в одном маршруте, а подключённая — молча ждала бы, пока
         кто-нибудь применит .ui-solo внутри панели. Её грузят сами такие
         страницы и /ui-catalog.html. -->

    <!-- 3. Составные элементы -->
    <link rel="stylesheet" href="/ui/modal.css">
    <link rel="stylesheet" href="/ui/toast.css">
    <link rel="stylesheet" href="/ui/table.css">
    <link rel="stylesheet" href="/ui/page-head.css">
    <link rel="stylesheet" href="/ui/popover.css">
    <link rel="stylesheet" href="/ui/empty-state.css">
    <link rel="stylesheet" href="/ui/skeleton.css">

    <!-- 4. Оболочка -->
    <link rel="stylesheet" href="/shell/panels.css">
    <link rel="stylesheet" href="/shell/desktop.css">
    <link rel="stylesheet" href="/shell/minimized.css">
    <!-- Список причин у окна архива и отказа (пункт Р7). Здесь, а не в CSS
         раздела: окно отказа одно на пять разделов (ответ на И118), а раскладка
         раздела грузится только вместе со своим разделом — пять копий одного
         правила разошлись бы на первой же правке. Слоем он при этом не
         является: узлы слоя зовутся .ui-*, а паспорт назвал классы .arc-*
         поимённо и сказал, что новых узлов слоя пункт не приносит. -->
    <link rel="stylesheet" href="/shell/archive.css">

    <!-- 5. Раскладка разделов сюда НЕ подключается: её грузит оболочка при
         первом открытии раздела (поле styles в реестре, shell/app.js). Иначе
         первый экран тянул бы раскладку всех шести разделов сразу. -->
</head>
<body>

<!-- Каркас приложения. Разметки разделов, окон и тостов здесь нет намеренно:
     разделы монтируются в панель, окна и тосты создаются вызовом. Именно это
     лечит #toastContainer на восьми страницах и #confirmModal на пяти. -->
<div class="shell" data-role="shell">
    <main class="shell-main">
        <!-- Стол лежит в потоке и виден, когда панелей нет. -->
        <div class="shell-desktop" data-role="desktop"></div>

        <!-- Сцена панелей накрывает стол целиком. Панели создаёт shell/panels.js,
             сюда он кладёт свой .shell-workspace. -->
        <div class="shell-stage" data-role="workspace-root" hidden></div>
    </main>

    <!-- Полоса свёрнутых. Скрыта, пока сворачивать нечего. -->
    <div class="shell-minimized" data-role="minimized" hidden></div>
</div>

<script type="module">
    import { shell } from '/shell/app.js';
    import { initDesktop } from '/shell/desktop.js';
    import { initMinimized } from '/shell/minimized.js';
    import { mountIconSprite } from '/ui/icons.js';

    // Набор значков кладётся в документ первым: и стол, и панели ссылаются на
    // его символы через <use>, а ссылка на ещё не вставленный символ рисует
    // пустоту молча.
    mountIconSprite();

    const desktop = document.querySelector('[data-role="desktop"]');
    const stage = document.querySelector('[data-role="workspace-root"]');
    const bar = document.querySelector('[data-role="minimized"]');

    // Стол и полоса подписываются на оболочку ДО старта: старт разбирает адрес
    // и может сразу открыть панели — на пустой странице это выглядело бы как
    // мигание пустого стола.
    initDesktop({ shell, desktop, stage });
    initMinimized({ shell, bar, stage });

    shell.start({ workspace: stage });
</script>

</body>
</html>

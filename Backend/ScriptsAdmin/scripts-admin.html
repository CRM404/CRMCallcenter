<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM – Скрипты</title>
    <link rel="stylesheet" href="./css/scripts-admin-light.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="toastContainer"></div>

    <div class="hub-shell">
        <nav class="hub-nav" id="hubNav"></nav>

        <main class="hub-main">
            <div class="canvas">

                <div class="identity-strip">
                    <div class="identity-copy">
                        <div class="eyebrow">CRM · Скрипты звонков</div>
                        <h1>Скрипты</h1>
                        <p>Сценарии разговора для операторов: основной текст и ответы на возражения. К лиду скрипт привязывается на странице «Лиды» — здесь только содержимое и статус.</p>
                    </div>
                    <dl class="stat-chips">
                        <div class="stat-chip"><dt>Всего</dt><dd id="saStatTotal">0</dd></div>
                        <div class="stat-chip ok"><dt>Активных</dt><dd id="saStatActive">0</dd></div>
                        <div class="stat-chip draft"><dt>Черновиков</dt><dd id="saStatDraft">0</dd></div>
                    </dl>
                    <button type="button" class="btn btn-primary" id="saNewScriptBtn"><i class="fas fa-plus" aria-hidden="true"></i>Новый скрипт</button>
                </div>

                <div class="table-card" id="saScriptListWrap">
                    <div class="table-scroll" id="saScriptList"></div>
                </div>

                <!-- Инлайн-создание вместо списка: единственное поле — название,
                     после создания скрипт сразу открывается на наполнение -->
                <div class="panel-card" id="saCreatePanel" hidden>
                    <h3>Новый скрипт</h3>
                    <div class="opened-head">
                        <div class="form-group">
                            <label for="saNewTitle">Название</label>
                            <input type="text" id="saNewTitle" placeholder="Например: Первичный обзвон — новостройки">
                        </div>
                        <div class="opened-head-actions">
                            <button type="button" class="btn btn-primary btn-sm" id="saCreateBtn">Создать</button>
                            <button type="button" class="btn btn-ghost btn-sm" id="saCreateCancelBtn">Отмена</button>
                        </div>
                    </div>
                </div>

                <!-- Открытый скрипт: шапка (название/статус) → основной текст → возражения -->
                <section id="saOpenedSection" hidden>
                    <div class="panel-card">
                        <div class="opened-head">
                            <div class="form-group">
                                <label for="saMetaTitle">Название</label>
                                <input type="text" id="saMetaTitle" aria-label="Название скрипта">
                            </div>
                            <div class="opened-head-actions">
                                <span class="status-chip" id="saOpenStatusChip">—</span>
                                <button type="button" class="btn btn-primary btn-sm" id="saMetaSaveBtn">Сохранить</button>
                                <button type="button" class="btn btn-ghost btn-sm" id="saHideNodesBtn">Скрыть</button>
                            </div>
                        </div>
                    </div>
                    <div id="saNodesPanel"></div>
                </section>

            </div>
        </main>
    </div>

    <!-- Общая модалка подтверждения: удаление скрипта/возражения, смена статуса -->
    <div class="modal-overlay" id="confirmModal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Подтверждение</h2>
                <button type="button" class="modal-close" id="confirmModalCloseBtn"><i class="fas fa-xmark" aria-hidden="true"></i></button>
            </div>
            <p id="confirmModalMessage"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="confirmModalCancelBtn">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirmModalOkBtn">Подтвердить</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/modules/scriptsAdminApp.js"></script>
</body>
</html>

<!-- Фрагмент раздела «Скрипты». Грузится оболочкой при первом монтировании
     панели и кэшируется в памяти (shell/app.js).

     ЗДЕСЬ НЕТ ГЛОБАЛЬНЫХ id: при двух открытых панелях getElementById вернул бы
     первый попавшийся, и раздел стал бы управлять чужим элементом. Поиск идёт
     только по data-role в границах своего контейнера.

     Своих кнопок, полей, таблиц, чипов, модалок и тостов раздел не объявляет —
     всё из слоя элементов. В scripts-admin-light.css остаётся только раскладка.

     Наполнение открытого скрипта (основной текст + возражения) рисуется из
     scriptsAdminNodes.js: там редактор, который зависит от состояния, и
     держать его половину здесь значило бы разорвать разметку надвое. -->

<div class="scr-section">

    <div class="ui-page-head">
        <h2 class="ui-page-head__title">Скрипты</h2>
        <span class="ui-page-head__sub">сценарии для операторов, привязка — на странице «Лиды»</span>
        <span class="ui-page-head__acts">
            <button type="button" class="ui-btn" data-role="new-script">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-plus"></use></svg>Новый скрипт
            </button>
        </span>
    </div>

    <ul class="ui-chips ui-page-chips">
        <li class="ui-chip"><span class="ui-chip__value" data-role="stat-total">—</span><span class="ui-chip__label">Всего</span></li>
        <li class="ui-chip ui-chip--ok"><span class="ui-chip__value" data-role="stat-active">—</span><span class="ui-chip__label">Активных</span></li>
        <li class="ui-chip ui-chip--muted"><span class="ui-chip__value" data-role="stat-draft">—</span><span class="ui-chip__label">Черновиков</span></li>
    </ul>

    <!-- Список скриптов. Прячется целиком, пока открыт скрипт или панель
         создания — как и на прежней странице. -->
    <div data-role="list-wrap">
        <div class="ui-table-wrap">
            <table class="ui-table ui-table--freeze-acts">
                <thead>
                    <tr>
                        <th>Скрипт</th>
                        <th>Статус</th>
                        <th class="ui-table__acts"></th>
                    </tr>
                </thead>
                <tbody data-role="rows"></tbody>
            </table>
        </div>

        <div class="ui-empty" data-role="empty" hidden>
            <span class="ui-empty__icon"><svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-scripts"></use></svg></span>
            <b class="ui-empty__title">Пока нет ни одного скрипта</b>
            <span class="ui-empty__text">Создайте первый — название можно будет изменить позже.</span>
            <button type="button" class="ui-btn ui-btn--ghost ui-empty__action" data-role="empty-action">Новый скрипт</button>
        </div>
    </div>

    <!-- Создание живёт в ОКНЕ СЛОЯ, а не в разметке раздела: карточка, которая
         была здесь, показывалась вместо списка — нажатие «Новый скрипт»
         стирало с экрана таблицу скриптов (Н9). Окно собирается в
         scriptsSection.js через openModal({ scope }). -->

    <!-- Открытый скрипт: шапка (название + статус) → наполнение. -->
    <section data-role="opened" hidden>
        <div class="scr-card">
            <div class="scr-inline">
                <div class="ui-field scr-inline__field">
                    <label class="ui-field__label">Название</label>
                    <input type="text" class="ui-field__control" data-role="meta-title" aria-label="Название скрипта">
                </div>
                <div class="ui-btn-row scr-inline__acts">
                    <span class="ui-pill" data-role="open-status">—</span>
                    <button type="button" class="ui-btn" data-role="meta-save">Сохранить</button>
                    <button type="button" class="ui-btn ui-btn--ghost" data-role="hide-nodes">Скрыть</button>
                </div>
            </div>
        </div>

        <div data-role="nodes"></div>
    </section>

</div>

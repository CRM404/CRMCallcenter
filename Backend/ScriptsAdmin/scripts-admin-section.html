<!-- Фрагмент раздела «Скрипты». Грузится оболочкой при первом монтировании
     панели и кэшируется в памяти (shell/app.js).

     ЗДЕСЬ НЕТ ГЛОБАЛЬНЫХ id: при двух открытых панелях getElementById вернул бы
     первый попавшийся, и раздел стал бы управлять чужим элементом. Поиск идёт
     только по data-role в границах своего контейнера.

     Своих кнопок, полей, таблиц, чипов, модалок и тостов раздел не объявляет —
     всё из слоя элементов. В scripts-admin-light.css остаётся только раскладка.

     Наполнение открытого скрипта (основной текст + возражения) рисуется из
     scriptsAdminNodes.js: там редактор, который зависит от состояния, и
     держать его половину здесь значило бы разорвать разметку надвое. -->

<div class="scr-section">

    <div class="ui-page-head">
        <h2 class="ui-page-head__title">Скрипты</h2>
        <span class="ui-page-head__sub">сценарии для операторов, привязка — на странице «Лиды»</span>
        <span class="ui-page-head__acts">
            <button type="button" class="ui-btn" data-role="new-script">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-plus"></use></svg>Новый скрипт
            </button>
        </span>
    </div>

    <!-- ПОЛОСА ВКЛАДОК (решение владельца 87). Отдельный экран справочника
         статусов не рисуется: справочник становится вкладкой там, где статусы
         используют. Место полосы — под шапкой раздела и НАД чипами: заголовок
         принадлежит разделу, всё ниже полосы — активной вкладке.

         Счётчик простой, а не капсула: --badge в проекте означает «столько-то
         ждёт тебя», а пятьдесят статусов ничего не ждут — это размер
         справочника, а не работа. -->
    <div class="ui-tabs" role="tablist">
        <button type="button" class="ui-tabs__tab ui-tabs__tab--active" data-role="tab-scripts" role="tab" aria-selected="true">Скрипты <span class="ui-tabs__count" data-role="tab-scripts-count">—</span></button>
        <button type="button" class="ui-tabs__tab" data-role="tab-statuses" role="tab" aria-selected="false">Статусы воронки <span class="ui-tabs__count" data-role="tab-statuses-count">—</span></button>
    </div>

    <ul class="ui-chips ui-page-chips">
        <li class="ui-chip"><span class="ui-chip__value" data-role="stat-total">—</span><span class="ui-chip__label">Всего</span></li>
        <li class="ui-chip ui-chip--ok"><span class="ui-chip__value" data-role="stat-active">—</span><span class="ui-chip__label">Активных</span></li>
        <li class="ui-chip ui-chip--muted"><span class="ui-chip__value" data-role="stat-draft">—</span><span class="ui-chip__label">Черновиков</span></li>
    </ul>

    <!-- Список скриптов ОСТАЁТСЯ НА ЭКРАНЕ, когда скрипт открыт на наполнение
         (К154). Прежде он прятался целиком — это имело смысл на отдельной
         странице, но не в панели: чтобы перейти к соседнему скрипту, нужно было
         нажать «Скрыть», дождаться списка и найти строку заново, а тот, кто
         правит возражения, ходит по двум-трём похожим скриптам подряд. Строка
         открытого скрипта отмечена .ui-table__row--selected, и список заодно не
         даёт завести второй скрипт с тем же названием — поиска в разделе нет. -->
    <div data-role="list-wrap">
        <div class="ui-table-wrap">
            <table class="ui-table ui-table--freeze-acts">
                <thead>
                    <tr>
                        <th>Скрипт</th>
                        <th>Статус</th>
                        <th class="ui-table__acts"></th>
                    </tr>
                </thead>
                <tbody data-role="rows"></tbody>
            </table>
        </div>

        <!-- Пояснение из макета (М34): список сам по себе не говорит, что со
             скриптом делать дальше, а «Открыть» в строке читается как «посмотреть».
             Прячется вместе со списком, когда скрипт открыт на наполнение. -->

        <p class="ui-table-note" data-role="list-note">Откройте скрипт, чтобы наполнить его основным текстом и возражениями.</p>
        <div class="ui-empty" data-role="empty" hidden>
            <!-- Ступень lg, а не sm (К88): у значка пустого состояния нет
                 соседнего текста — он знак самого блока, а не подпись к строке,
                 и ступень берёт не по соседу. -->
            <span class="ui-empty__icon"><svg class="ui-ic ui-ic--lg" aria-hidden="true"><use href="#ui-ic-scripts"></use></svg></span>
            <b class="ui-empty__title">Пока нет ни одного скрипта</b>
            <span class="ui-empty__text">Создайте первый — название можно будет изменить позже.</span>
            <button type="button" class="ui-btn ui-btn--ghost ui-empty__action" data-role="empty-action">Новый скрипт</button>
        </div>
    </div>

    <!-- Создание живёт в ОКНЕ СЛОЯ, а не в разметке раздела: карточка, которая
         была здесь, показывалась вместо списка — нажатие «Новый скрипт»
         стирало с экрана таблицу скриптов (Н9). Окно собирается в
         scriptsSection.js через openModal({ scope }). -->

    <!-- Открытый скрипт: шапка (название + статус) → наполнение. -->
    <section data-role="opened" hidden>
        <!-- Карточка открытого скрипта отмечена цветом (К164): она относится к
             строке, подсвеченной в списке выше, и связь между ними должна
             читаться без чтения текста. -->
        <div class="scr-card scr-card--open">
            <div class="scr-inline">
                <div class="ui-field scr-inline__field">
                    <label class="ui-field__label">Название</label>
                    <input type="text" class="ui-field__control" data-role="meta-title" aria-label="Название скрипта">
                </div>
                <div class="ui-btn-row scr-inline__acts">
                    <span class="ui-pill" data-role="open-status">—</span>
                    <button type="button" class="ui-btn" data-role="meta-save">Сохранить</button>
                    <button type="button" class="ui-btn ui-btn--ghost" data-role="hide-nodes">Скрыть</button>
                </div>
            </div>
        </div>

        <div data-role="nodes"></div>
    </section>

    <!-- Вкладка «Статусы воронки»: полсотни строк в восьми коробках по этапам.
         Правится всё, кроме разбиения: имя и два признака — в окне, пометка —
         списком прямо в строке, заведение — полем внизу своей коробки.
         Этапы закреплены: восьмого экран завести не даёт, перенести статус
         между этапами тоже. Текст плашки собирается в коде — он считает
         неразмеченные, а их число меняется на глазах. -->
    <div data-role="statuses-wrap" hidden>
        <div class="ui-note">
            <svg class="ui-ic ui-ic--sm ui-note__icon" aria-hidden="true"><use href="#ui-ic-info"></use></svg>
            <div class="ui-note__body">
                <div class="ui-note__text" data-role="statuses-note"></div>
            </div>
        </div>
        <div data-role="statuses-stages"></div>
    </div>

</div>

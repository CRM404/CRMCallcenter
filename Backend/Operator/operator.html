<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM – Оператор</title>
    <link rel="stylesheet" href="./css/operator-light.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="op-shell">
        <nav class="op-nav" id="opNav"></nav>

        <main class="op-main">
            <div class="op-container">
                <h1>Рабочий стол</h1>

                <div id="opListView"></div>

                <div id="opDetailView" style="display:none;">
                    <button type="button" class="op-back-link" id="opBackToListBtn">
                        <i class="fas fa-arrow-left" aria-hidden="true"></i> Назад к списку
                    </button>
                    <div class="op-detail-grid">
                        <section class="op-panel" id="opScriptPanel"></section>
                        <section class="op-panel" id="opCardPanel"></section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script type="module" src="./js/modules/operatorApp.js"></script>
</body>
</html>

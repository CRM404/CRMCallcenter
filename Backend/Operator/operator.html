<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM – Оператор</title>
    <!-- ========================= СЛОЙ ЭЛЕМЕНТОВ =========================
         Страница оператора жила ВНЕ слоя: своих правил `ui-*` у неё не было ни
         одного, и в коде это было записано прямо — «узла .ui-note__title здесь
         нет — страница оператора живёт вне слоя» (operatorLeadForm.js).
         ⚠ Та запись снята К310: плашка номера переехала на .ui-note, и заголовок
         у неё теперь .ui-note__title — тот самый узел, которого «нет».

         ПОДКЛЮЧАЕТСЯ НЕ РАДИ ЛЕНТЫ. Макет рабочего места редакции 4 собран
         дословно на слое, и на слой рассчитывает он весь — лента просто пришла
         первой и упёрлась. Выборочное подключение развалилось бы на первой же
         правке, которой понадобился бы недостающий файл.

         ⚠⚠ И РОВНО ОДНО ИСКЛЮЧЕНИЕ ИЗ ЭТОГО ДОВОДА — `ui/page-head.css`, снятый
         задачей 54. Довод выше про файлы, которые странице МОГУТ понадобиться;
         этот не понадобится никогда. `.ui-page-head` — шапка РАЗДЕЛА оболочки:
         она применяется в восьми разделах (`calls`, `cpa-networks`,
         `employees`, `history`, `leads`, `main`, `scripts-admin`, `settings`) и
         ни разу здесь, а разделом рабочее место не становится — решение
         владельца 69. Замер на `9cdc5e3`: все семь имён файла — `ui-page-head`,
         `__title`, `__sub`, `__acts`, `ui-page-chips`, `ui-toolbar`,
         `__spacer` — встречаются во всём каталоге `Backend/Operator` НОЛЬ раз,
         и считано это ПО ФАЙЛАМ, а не по разметке: счёт по разметке на этой же
         странице однажды соврал вшестеро (задача 44, значки).

         СОСТАВ — ШЕСТНАДЦАТЬ ФАЙЛОВ, И ОТ ОБОЛОЧКИ ОН ТЕПЕРЬ ОТЛИЧАЕТСЯ ДВУМЯ.
         Порядок прежний, оболочкин (Shell/index.html). Отличия: НЕТ
         `page-head.css` (задача 54) и ЕСТЬ `float.css` — перемещаемое окно
         завела задача 1, и в оболочке его пока не применяет никто.
         ⚠ Прежняя запись говорила «состав и порядок — как в оболочке,
         пятнадцать файлов»: и число было мимо — их было шестнадцать, — и
         совпадение с оболочкой больше не держится.

         `ui/solo.css` не подключается и здесь: это раскладка страницы БЕЗ
         оболочки, её грузят вход оператора и выдача ключа туннеля.

         СТОИТ ПЕРЕД `operator-light.css`, а не после. Раскладка страницы —
         своя, и при споре побеждать должна она: слой даёт узлы, страница даёт
         своё расположение.

         ЗАМЕР ДО И ПОСЛЕ СНЯТ ОДНИМ ПРИБОРОМ. Тридцать шесть замеров рабочего
         места, сдвигов ноль. И отдельно проверено, что слой ДЕЙСТВИТЕЛЬНО
         применился: ноль сдвигов у неподключённого слоя выглядел бы так же.
         Два опасных места проверены отдельно: `.form-group` в field.css —
         только комментарий, а не правило; глобальный `box-sizing` из tokens.css
         у оператора уже стоял (operator-light.css:12).
         ================================================================== -->

    <!-- 1. Токены -->
    <link rel="stylesheet" href="/ui/tokens.css" />

    <!-- 2. Базовые элементы -->
    <link rel="stylesheet" href="/ui/icons.css" />
    <link rel="stylesheet" href="/ui/button.css" />
    <link rel="stylesheet" href="/ui/field.css" />
    <link rel="stylesheet" href="/ui/chip.css" />
    <link rel="stylesheet" href="/ui/tabs.css" />
    <link rel="stylesheet" href="/ui/note.css" />
    <link rel="stylesheet" href="/ui/link.css" />

    <!-- 3. Составные элементы -->
    <link rel="stylesheet" href="/ui/modal.css" />
    <link rel="stylesheet" href="/ui/toast.css" />
    <link rel="stylesheet" href="/ui/table.css" />
    <link rel="stylesheet" href="/ui/popover.css" />
    <link rel="stylesheet" href="/ui/empty-state.css" />
    <link rel="stylesheet" href="/ui/skeleton.css" />
    <link rel="stylesheet" href="/ui/fold.css" />
    <link rel="stylesheet" href="/ui/float.css" />

    <link rel="stylesheet" href="./css/operator-light.css" />
</head>
<body>
    <div class="op-shell">
        <nav class="op-nav" id="opNav"></nav>

        <main class="op-main">
            <div class="op-container">
                <!-- Верхняя полоса: заголовок + блок оператора. Единственное
                     место, где живут состояние и таймеры. -->
                <div class="op-topbar">
                    <h1>Рабочий стол</h1>
                    <div class="op-topbar-spacer"></div>
                    <div class="op-identity">
                        <div class="op-identity-avatar" id="opIdentityAvatar"></div>
                        <div class="op-identity-copy">
                            <div class="op-identity-name" id="opIdentityName">—</div>
                            <div class="op-identity-line" id="opIdentityLine">—</div>
                        </div>
                        <button type="button" class="op-state" id="opStatePill" aria-haspopup="true" aria-expanded="false">
                            <span class="op-state__dot"></span>
                            <span id="opStateName">—</span>
                            <span class="op-state__timer" id="opStateTimer">00:00</span>
                        </button>
                        <div class="op-state-panel" id="opStatePanel" hidden></div>
                    </div>
                </div>

                <!-- Три взаимоисключающих состояния: работа с лидом,
                     пустая очередь, «не на линии». -->
                <div id="opWorkArea"></div>
            </div>
        </main>
    </div>

    <!-- Кнопка поиска возражений — в правом нижнем углу СТРАНИЦЫ, как чат
         (решение владельца). На экранах пустой очереди и «не на линии» скрыта:
         скрипта там нет и искать нечего. -->
    <button type="button" class="op-fab" id="opObjBtn" aria-label="Возражения" hidden>
        <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-comments"></use></svg>
    </button>
    <div class="op-obj-panel" id="opObjPanel" hidden></div>

    <div id="toastContainer"></div>

    <script type="module" src="./js/modules/operatorApp.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM – Вход оператора</title>
    <link rel="stylesheet" href="./css/operator-light.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="op-login-shell">
        <div class="op-login-card">
            <h1>Вход оператора</h1>
            <div class="op-login-error" id="opLoginError"></div>
            <form id="opLoginForm" novalidate>
                <div class="form-group">
                    <label for="opLoginEmail">Email</label>
                    <input type="email" id="opLoginEmail" name="email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="opLoginPassword">Пароль</label>
                    <input type="password" id="opLoginPassword" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="opLoginSubmitBtn">Войти</button>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script type="module" src="./js/modules/operatorLoginApp.js"></script>
</body>
</html>

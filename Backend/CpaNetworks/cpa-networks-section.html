<!-- Фрагмент раздела «CPA-сети». Грузится оболочкой при первом монтировании
     панели и кэшируется в памяти (shell/app.js).

     РАЗДЕЛ ПЕРЕПИСАН НА МАСТЕР-ДЕТАЛЬ (К73 и восемнадцать пунктов, которые
     закрываются вместе с ней): сети — списком слева, их офферы — таблицей
     справа. Полосы вкладок сетей поверх таблицы в целевом состоянии нет:
     вкладка означает «режим», а сеть — это отбор, у которого есть свои
     подписи, счётчики и статус, и в полосу они не помещались.

     ЗДЕСЬ НЕТ ГЛОБАЛЬНЫХ id (К83). Их было 62, и пять из них совпадали с
     «Источниками»: при двух открытых панелях getElementById вернул бы узел
     чужой панели, и раздел управлял бы чужим элементом — молча, без единой
     ошибки в консоли. Поиск идёт только по data-role в границах контейнера.

     ОКОН В РАЗМЕТКЕ НЕТ. Оба прежних (оффер и «Управление сетями») собираются
     вызовом openModal из слоя: разметочное окно выглядит как окно, но не ведёт
     себя как окно — ни Esc, ни ловушки фокуса, ни вопроса о несохранённом
     (К74, К78). Третье окно, «Настройка списков», раньше было режимом внутри
     окна оффера и стало отдельным (К146).

     Своих кнопок, полей, таблиц, чипов и пустых состояний раздел не объявляет —
     всё из слоя. В cpa-networks-light.css остаётся только раскладка. -->

<div class="cpa-wrap">

    <div class="ui-page-head">
        <h2 class="ui-page-head__title">CPA-сети</h2>
        <span class="ui-page-head__sub">ставки, условия и требования к лиду</span>
        <span class="ui-page-head__acts">
            <button type="button" class="ui-btn ui-btn--ghost" data-role="manage-networks">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-gear"></use></svg>Управление сетями
            </button>
            <!-- Значок БЕЗ --quiet (К153): на графитовой заливке основной кнопки
                 приглушённый светло-серый значок не читался вовсе, а такая же
                 кнопка «Добавить источник» в «Источниках» наследует белый цвет
                 текста. Одинаковые по смыслу кнопки не могут выглядеть
                 по-разному в двух разделах. -->
            <button type="button" class="ui-btn" data-role="add-offer">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-plus"></use></svg>Добавить оффер
            </button>
        </span>
    </div>

    <!-- Строки чипов-счётчиков у раздела НЕТ (К76). Прежняя показывала «Офферов
         всего 1» при трёх офферах в разделе: считала она выбранную сеть, а
         подписана была разделом. Числа живут там, где они правдивы: у каждой
         сети в списке слева своё, под заголовком детали — сводка по выбранной. -->

    <div class="cpa-master">
        <aside class="cpa-side">
            <div class="cpa-side__title">Сети</div>
            <div class="cpa-side__list" data-role="network-list"></div>
            <button type="button" class="ui-btn ui-btn--ghost" data-role="add-network">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-plus"></use></svg>Сеть
            </button>
            <!-- «Настройка списков» стоит здесь, а не в шапке окна оффера
                 (К146): справочники — это не режим карточки, а свой экран. -->
            <button type="button" class="ui-btn ui-btn--ghost" data-role="params-lists">Настройка списков</button>
            <p class="cpa-side__note" data-role="network-note"></p>
        </aside>

        <div class="cpa-main">
            <!-- Шапка детали отвечает на вопрос «где я нахожусь» без возврата к
                 списку. В узкой панели, где список сетей свернулся в строку, она
                 остаётся единственным местом с полным именем сети. -->
            <div class="cpa-detail-head" data-role="detail-head" hidden>
                <div>
                    <div class="cpa-detail-head__title" data-role="detail-title"></div>
                    <div class="cpa-detail-head__sub" data-role="detail-sub"></div>
                </div>
                <button type="button" class="ui-btn ui-btn--icon ui-btn--row" data-role="edit-network"
                        title="Настройки сети" aria-label="Настройки сети">
                    <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-edit"></use></svg>
                </button>
            </div>

            <!-- Поиск своей строкой, вкладки статусов — под ним (М31). В одной
                 строке вкладки читались как продолжение поиска, хотя отбирают
                 другое и другим способом. -->
            <div class="ui-toolbar">
                <div class="ui-field cpa-search">
                    <input type="search" class="ui-field__control" data-role="search"
                           placeholder="Найти оффер по названию…" aria-label="Поиск офферов">
                </div>
            </div>

            <div class="ui-tabs" data-role="status-tabs"></div>

            <div class="ui-table-wrap" data-role="table-wrap">
                <table class="ui-table ui-table--freeze-acts">
                    <thead>
                        <tr>
                            <th>Оффер</th>
                            <th>Тип действия</th>
                            <th class="ui-table__num">Ставка</th>
                            <th>Период</th>
                            <th class="ui-table__num">Лидов</th>
                            <th>Статус</th>
                            <th class="ui-table__acts"></th>
                        </tr>
                    </thead>
                    <tbody data-role="rows"></tbody>
                </table>
            </div>

            <!-- Полный .ui-empty, а не --inline (К89): вариант для формы,
                 прижатый влево и без рамки, посреди пустой панели не читается
                 как ответ на вопрос «почему тут ничего нет». Значок ступени lg
                 (К88): у него нет соседнего текста, он знак самого блока. -->
            <div class="ui-empty" data-role="empty" hidden>
                <span class="ui-empty__icon"><svg class="ui-ic ui-ic--lg" aria-hidden="true"><use href="#ui-ic-cpa"></use></svg></span>
                <b class="ui-empty__title" data-role="empty-title"></b>
                <span class="ui-empty__text" data-role="empty-text"></span>
                <button type="button" class="ui-btn ui-btn--ghost ui-empty__action" data-role="empty-action" hidden></button>
            </div>

            <!-- Подвал списка (К148): «Показано N из M» — та же формулировка,
                 что в «Лидах», «Сотрудниках» и «Источниках». Из четырёх списков
                 проекта подвала не было только здесь. -->
            <div class="ui-table-foot" data-role="foot" hidden>
                <span data-role="foot-shown"></span>
            </div>
        </div>
    </div>

</div>

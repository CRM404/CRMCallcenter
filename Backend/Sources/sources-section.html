<!-- Фрагмент раздела «Источники». Грузится оболочкой при первом монтировании
     панели и кэшируется в памяти (shell/app.js).

     ЗДЕСЬ НЕТ ГЛОБАЛЬНЫХ id — это главная техническая ловушка задачи: при двух
     открытых панелях getElementById вернул бы первый попавшийся, и раздел стал
     бы управлять чужим элементом. Поиск идёт только по data-role в границах
     своего контейнера.

     Своих кнопок, полей, таблиц, чипов, модалок и тостов раздел не объявляет —
     всё из слоя элементов. В sources-light.css остаётся только раскладка. -->

<div class="src-section">

    <div class="ui-page-head">
        <h2 class="ui-page-head__title">Источники</h2>
        <span class="ui-page-head__sub">откуда приходят лиды</span>
        <span class="ui-page-head__acts">
            <button type="button" class="ui-btn ui-btn--ghost" data-role="manage-platforms">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-gear"></use></svg>Управление площадками
            </button>
            <button type="button" class="ui-btn" data-role="add-source">
                <svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-plus"></use></svg>Добавить источник
            </button>
        </span>
    </div>

    <!-- Строки чипов-счётчиков у раздела НЕТ — решение дизайн-сессии (М16,
         подтверждено паспортом): числа и так на виду, у каждой площадки свой
         счётчик источников, у каждой вкладки статуса — свой. Второй раз те же
         числа не показываем. Узлы не оставлены скрытыми намеренно: скрытая
         разметка, которую никто не наполняет, через месяц читается как поломка.
         -->

    <!-- Мастер-деталь: слева площадки, справа их источники (бриф, п.6). -->
    <div class="src-master">
        <aside class="src-side">
            <div class="src-side__title">Площадки</div>
            <div class="src-side__list" data-role="platform-list"></div>
            <p class="src-side__note" data-role="platform-note"></p>
        </aside>

        <div class="src-main">
            <div class="ui-tabs" data-role="status-tabs"></div>

            <div class="ui-toolbar">
                <div class="ui-field src-search">
                    <input type="search" class="ui-field__control" data-role="search"
                           placeholder="Поиск по корневому источнику, источнику лидов, площадке, CPA-сети, городу, статусу…"
                           aria-label="Поиск источников">
                </div>
                <!-- Два списка из макета. Составы собираются из самих данных:
                     регионы — из городов источников, сети — из справочника. -->
                <div class="ui-field">
                    <select class="ui-field__control" data-role="filter-region" aria-label="Регион">
                        <option value="">Все регионы</option>
                    </select>
                </div>
                <div class="ui-field">
                    <select class="ui-field__control" data-role="filter-network" aria-label="CPA-сеть">
                        <option value="">Все CPA-сети</option>
                    </select>
                </div>
            </div>

            <div class="ui-fchips" data-role="filter-chips" hidden></div>

            <div class="ui-table-wrap" data-role="table-wrap">
                <table class="ui-table ui-table--freeze-acts">
                    <thead>
                        <tr>
                            <th class="ui-table__sel">
                                <input type="checkbox" data-role="check-all" aria-label="Выделить все">
                            </th>
                            <th data-role="col-platform" hidden>Площадка</th>
                            <th>Корневой источник</th>
                            <th>Город/Регион</th>
                            <th>CPA-сети</th>
                            <th>Статус</th>
                            <th>Источник лидов</th>
                            <th class="ui-table__acts"></th>
                        </tr>
                    </thead>
                    <tbody data-role="rows"></tbody>
                </table>
            </div>

            <div class="ui-empty" data-role="empty" hidden>
                <span class="ui-empty__icon"><svg class="ui-ic ui-ic--sm" aria-hidden="true"><use href="#ui-ic-sources"></use></svg></span>
                <b class="ui-empty__title" data-role="empty-title"></b>
                <span class="ui-empty__text" data-role="empty-text"></span>
                <button type="button" class="ui-btn ui-btn--ghost ui-empty__action" data-role="empty-action" hidden></button>
            </div>

            <div class="ui-table-foot" data-role="foot" hidden>
                <span data-role="foot-shown"></span>
                <span data-role="foot-selected"></span>
            </div>

            <div class="ui-mass-bar" data-role="mass-bar" hidden>
                <span class="ui-mass-bar__count" data-role="selected-count">Выбрано: 0</span>
                <select class="ui-field__control src-mass-select" data-role="mass-action" aria-label="Массовое действие">
                    <option value="">— выберите действие —</option>
                    <option value="Активен">Статус → Активен</option>
                    <option value="Неактивен">Статус → Неактивен</option>
                    <option value="Архив">Статус → Архив</option>
                    <option value="delete">Удалить</option>
                </select>
                <button type="button" class="ui-btn" data-role="mass-apply">Применить</button>
                <button type="button" class="ui-btn ui-btn--ghost" data-role="mass-clear">Снять выделение</button>
            </div>
        </div>
    </div>

</div>

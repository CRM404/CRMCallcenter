<!-- Фрагмент раздела «Настройки». Грузится оболочкой при первом открытии панели
     и кэшируется.

     РАЗМЕТКИ ЗДЕСЬ ПОЧТИ НЕТ, И ЭТО НЕ НЕДОДЕЛКА. Список настроек приходит с
     сервера ЦЕЛИКОМ — имя, описание, тип значения, единица, группа и порядок
     лежат в `app_settings` (паспорт Р8, работа Б9.1). Нарисовать здесь семь
     строк заранее значило бы завести второй источник правды: правка описания
     строкой в таблице разошлась бы с текстом в этом файле, и никто не узнал бы,
     который настоящий.

     ID ЗДЕСЬ НЕТ НИ ОДНОГО — в одном документе живут две панели, и совпавший id
     связал бы подпись с чужим полем. Всё через data-role и container.querySelector.

     ПУСТОГО СОСТОЯНИЯ У РАЗДЕЛА НЕ БЫВАЕТ. Таблица засевается вместе со схемой,
     поэтому пустой список означает сломанный запрос, а не отсутствие данных —
     и показывать в этом случае надо `.ui-load-error` (её ставит оболочка), а не
     «здесь пока пусто». Своего пустого состояния раздел не заводит.
-->

<div class="set-section">

    <div class="ui-page-head">
        <h2 class="ui-page-head__title">Настройки</h2>
        <span class="ui-page-head__sub">поведение системы: тумблеры, окна времени, пороги</span>
    </div>

    <!-- Столбец, а не таблица во всю панель: настройки читают, а не
         просматривают. Раздел меряет себя по панели (container-type на
         .set-wrap), поэтому и в половине панели раскладка своя. -->
    <div class="set-wrap" data-role="settings-list"></div>

</div>
